<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROVIGOL – Iscrizione calcetto</title>
  <meta name="description" content="ROVIGOL – Iscrizione al torneo di calcio a 5." />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px 90px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
      color: #ffffff;
      background: linear-gradient(135deg, #0b6b3a 0%, #16a34a 55%, #65c466 100%);
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.16), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(255, 255, 255, 0.12), transparent 45%);
      pointer-events: none;
    }

    .contenitore {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: clamp(1.9rem, 6.5vw, 2.8rem);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    }

    .sottotitolo {
      margin-top: 10px;
      margin-bottom: 28px;
      font-size: clamp(0.95rem, 3.2vw, 1.15rem);
      color: rgba(255, 255, 255, 0.9);
    }

    .descrizione {
      width: 100%;
      padding: 24px 22px;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 18px;
      backdrop-filter: blur(6px);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.22);
      font-size: clamp(0.95rem, 3vw, 1.05rem);
      line-height: 1.6;
      text-align: left;
      color: rgba(255, 255, 255, 0.95);
    }

    .descrizione strong {
      display: block;
      margin-bottom: 10px;
      font-size: 1.05em;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #ffffff;
    }

    /* quadrato PayPal piccolo */
    .quadrato-paypal {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-top: 28px;
      width: 130px;
      height: 130px;
      text-decoration: none;
      background: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 18px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.28);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .quadrato-paypal:hover {
      background: #f2f7ff;
      transform: translateY(-5px);
      box-shadow: 0 20px 38px rgba(0, 0, 0, 0.32);
    }

    .quadrato-paypal:active { transform: translateY(0); }

    .quadrato-paypal:focus-visible { outline: 3px solid #ffffff; outline-offset: 4px; }

    .paypal-logo {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #003087;
    }

    .paypal-logo span { color: #009cde; }

    .paypal-testo-piccolo {
      font-size: 0.68rem;
      font-weight: 600;
      color: #5a6b7b;
      letter-spacing: 0.06em;
    }

    .btn-indietro {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      color: #0b6b3a;
      background: #ffffff;
      border-radius: 999px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .btn-indietro:hover { background: #f2f7f2; transform: translateY(-2px); }

    .btn-indietro:focus-visible { outline: 3px solid #ffffff; outline-offset: 4px; }
  </style>
</head>
<body>

  <main class="contenitore">
    <h1>Iscrizione calcetto</h1>
    <p class="sottotitolo">Torneo di calcio a 5</p>

    <section class="descrizione">
      <strong>Work in progress</strong>
      Aggiungere descrizione: spiegare come iscrivere le squadre, indicare
      numero minimo e massimo di giocatori, scadenze per la consegna delle
      liste, quota di partecipazione e tutte le informazioni utili.
    </section>

    <!-- Sostituisci IL-TUO-LINK con il tuo vero link PayPal -->
    <a class="quadrato-paypal"
       href="https://www.paypal.com/paypalme/IL-TUO-LINK"
       target="_blank"
       rel="noopener noreferrer">
      <span class="paypal-logo">Pay<span>Pal</span></span>
      <span class="paypal-testo-piccolo">PAGA ORA</span>
    </a>
  </main>

  <a class="btn-indietro" href="iscrizione-torneo.html">← Indietro</a>

</body>
</html>

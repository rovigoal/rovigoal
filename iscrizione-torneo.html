<!DOCTYPE html>

      <div class="content-header">

        <h1 class="display">Scegli la <span class="accent">disciplina</span></h1>

      <nav class="cards grid-2 compact">

        <a href="iscrizione-green-volley.html" class="card">

            <!-- Pallone da volley -->
            <svg viewBox="0 0 64 64" width="56" height="56" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">

              <path d="M 32 4 C 24 20 24 44 32 60"/>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROVIGOL – Iscrizione torneo</title>
  <meta name="description" content="ROVIGOL – Iscrizioni al torneo di calcio a 5 e green volley." />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px 90px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
      color: #ffffff;
      background: linear-gradient(135deg, #0b6b3a 0%, #16a34a 55%, #65c466 100%);
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.16), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(255, 255, 255, 0.12), transparent 45%);
      pointer-events: none;
    }

    .contenitore {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 860px;
    }

    h1 {
      font-size: clamp(1.9rem, 6.5vw, 2.8rem);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    }

    .sottotitolo {
      margin-top: 10px;
      margin-bottom: 36px;
      font-size: clamp(0.95rem, 3.2vw, 1.15rem);
      color: rgba(255, 255, 255, 0.9);
    }

    .griglia {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
    }

    .quadrato {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1 / 1;
      padding: 20px;
      text-decoration: none;
      color: #ffffff;
      font-size: clamp(1.05rem, 3.6vw, 1.5rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 22px;
      backdrop-filter: blur(6px);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.22);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .quadrato:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-5px);
      box-shadow: 0 20px 38px rgba(0, 0, 0, 0.3);
    }

    .quadrato:active {
      transform: translateY(0);
    }

    .quadrato:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 4px;
    }

    /* tasto indietro in basso a destra */
    .btn-indietro {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      color: #0b6b3a;
      background: #ffffff;
      border-radius: 999px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .btn-indietro:hover {
      background: #f2f7f2;
      transform: translateY(-2px);
    }

    .btn-indietro:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 4px;
    }

    @media (max-width: 520px) {
      .griglia {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .quadrato {
        aspect-ratio: auto;
        min-height: 130px;
      }
    }
  </style>
</head>
<body>

  <main class="contenitore">
    <h1>Iscrizione torneo</h1>
    <p class="sottotitolo">Scegli la disciplina</p>

    <nav class="griglia">
      <a class="quadrato" href="iscrizione-calcetto.html">Iscrizione<br />calcetto</a>
      <a class="quadrato" href="iscrizione-green-volley.html">Iscrizione<br />green volley</a>
    </nav>
  </main>

  <a class="btn-indietro" href="home.html">← Indietro</a>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROVIGOL — Menù</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page content-page">
    <div class="container">
      <header class="topbar">
        <a href="index.html" class="logo">Rovigol</a>
        <span class="topbar-badge">Menù</span>
      </header>

      <div class="content-header">
        <span class="eyebrow">Menù della cena</span>
        <h1 class="display">Cosa si <span class="accent">mangia</span></h1>
      </div>

      <div class="panel">
        <div class="menu-item">
          <div>
            <div class="menu-item-name">Pasta con il tonno</div>
            <div class="menu-item-desc">Piatto unico della serata</div>
          </div>
          <span class="menu-item-emoji">🍝</span>
        </div>
      </div>

      <!-- Invito iscrizione cena -->
      <div class="panel">
        <div class="panel-body" style="text-align:center;">
          <p>Se gradisci il nostro menù, iscriviti alla cena!</p>
        </div>

        <div class="action-box" style="margin-top:20px;">
          <a class="btn-secondary" href="iscrizione-cena.html" style="background:var(--bg); border-color:var(--bg); color:var(--text);">
            <span class="icon">🍝</span> Iscriviti alla cena
          </a>
        </div>
      </div>
    </div>
  </div>

  <a href="home.html" class="back-btn">← Indietro</a>

  <script src="effect.js"></script>
</body>
</html>
